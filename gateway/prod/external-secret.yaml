# Pulls the Roastery gateway admin credentials from OpenBao into a
# native Secret the Deployment consumes. In OpenBao, create the secret
# at secret/homelab/roastery-admin with fields username and password:
#   bao kv put secret/homelab/roastery-admin username=... password=...
# (Same pattern as k8s/ignition/external-secret.yaml in the homelab
# repo, which uses homelab/ignition-admin for the platform gateway.)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: roastery-admin
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: roastery-admin
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: homelab/roastery-admin
        property: username
    - secretKey: password
      remoteRef:
        key: homelab/roastery-admin
        property: password
