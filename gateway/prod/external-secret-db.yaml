# Pulls the Postgres password from OpenBao. In OpenBao, create the
# secret at secret/homelab/roastery-db with a single password field:
#   bao kv put secret/homelab/roastery-db password=...
# The same Secret feeds the Postgres StatefulSet. The gateway's own
# database connection does not read this Secret directly: inside the
# gateway, the db connection references a gateway secret named
# roastery-db-password (see gateway/config/), which a human creates
# in the gateway secret provider with this same password on first
# setup. Keeping the two in sync is a first version wart, noted in
# the prod README.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: roastery-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: roastery-db
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: homelab/roastery-db
        property: password
