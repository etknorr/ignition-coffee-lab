# Gateway API route for the Roastery, attaching to the shared Gateway
# (k8s/gateway/ in the homelab repo). Perspective sessions are
# long-lived websockets; Gateway API and Traefik handle them without
# special annotations.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: roastery
spec:
  parentRefs:
    - name: homelab
      namespace: gateway
  hostnames:
    - roastery.home.lan
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: roastery
          port: 8088
