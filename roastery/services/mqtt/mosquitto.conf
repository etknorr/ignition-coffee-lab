# Mosquitto broker for the Roastery MQTT source slot.
# The Pico W roaster monitor publishes bean temperature here
# (topic roastery/sr800/temp); a bridge on the gateway side writes
# the values into the RoasterSource Mqtt slot tag. Anonymous access
# is a local network convenience posture only; set a password file
# before exposing this broker beyond a trusted LAN.
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest stdout
